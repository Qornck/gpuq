name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-binary:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install binary builder
        run: python -m pip install -e '.[binary]'
      - name: Build standalone Linux x86_64 binary
        run: PYTHON=python GPUQ_BINARY_ARCH=linux-x86_64 scripts/build_binary.sh
      - name: Smoke test standalone binary
        run: |
          ./dist/gpuq --version
          ./dist/gpuq --help
          ./dist/gpuq submit --help
          ./dist/gpuq --gpuq-internal-runner --help
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            dist/gpuq-v*-linux-x86_64.tar.gz
            dist/gpuq-v*-linux-x86_64.tar.gz.sha256
