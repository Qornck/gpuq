name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-binary:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install binary builder
        run: python -m pip install -e '.[binary]'
      - name: Build standalone Linux x86_64 binary
        run: PYTHON=python GPUQ_BINARY_ARCH=linux-x86_64 scripts/build_binary.sh
      - name: Smoke test standalone binary
        run: |
          ./dist/gpuq --version
          ./dist/gpuq --help
          ./dist/gpuq submit --help
          ./dist/gpuq --gpuq-internal-runner --help
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          archive="dist/gpuq-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          checksum="${archive}.sha256"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" "$checksum" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "$checksum" \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file "$notes"
          fi
